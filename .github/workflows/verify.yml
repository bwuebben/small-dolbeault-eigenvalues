name: Verify both papers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run finite computations and verify released files
        run: make checks integrity
      - name: Validate citation metadata
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate -i CITATION.cff
          cffconvert --validate -i paper3/CITATION.cff
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Build both manuscripts
        run: make papers
